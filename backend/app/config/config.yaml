# 全局配置
global:
  cache_dir: "cache/external_api"             # 缓存目录
  # exchange_calendars 临时休市兜底配置（按 ISO 日期 YYYY-MM-DD 写入）
  # 如需覆盖某一天为非交易日，可在此追加日期，例如 ["2025-12-26"]
  adhoc_holidays: []

# 外部API提供商配置
providers:
  tickflow:
    name: "TickFlow API"
    base_url: "https://api.tickflow.org"
    # TickFlow 使用 Header x-api-key 认证，API Key 来自环境变量 TICKFLOW_API_KEY
    # TickFlow SDK 无需在此维护 token，调用 TickFlow() 时自动读取
    endpoints:
      # 交易所清单（缓存1年）
      exchange:
        path: "exchanges.list"
        method: "SDK"
        cache_ttl: 31536000
      # 标的池（缓存1年，用于代码搜索本地过滤）
      universe_etf:
        path: "universes.get:CN_ETF"
        method: "SDK"
        cache_ttl: 31536000
      universe_equity_a:
        path: "universes.get:CN_Equity_A"
        method: "SDK"
        cache_ttl: 31536000
      # 交易日历（缓存1天，使用 exchange_calendars 离线库）
      calendar:
        path: "exchange_calendars"
        method: "OFFLINE"
        cache_ttl: 86400
      # 实时行情（缓存3小时）
      realtime:
        path: "quotes.get"
        method: "SDK"
        cache_ttl: 10800
      # 日 K 线（缓存1年）
      daily:
        path: "klines.get:1d"
        method: "SDK"
        cache_ttl: 31536000
      # 5 分钟 K 线（缓存1年）
      kline_5min:
        path: "klines.get:5m"
        method: "SDK"
        cache_ttl: 31536000
